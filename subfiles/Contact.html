<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Josh's Labs · Contact</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== CONTACT PAGE ===== */
.contact-container h1 {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1px;
    margin-bottom: 8px;
    text-align: center;
}

.contact-container h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.contact-container .sub-text {
    font-size: 17px;
    color: var(--text-muted);
    margin-bottom: 32px;
    text-align: center;
}

.contact-items {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}

.contact-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text-light);
    font-size: 18px;
    font-weight: 500;
    transition: all 0.3s ease;
    cursor: default;
}

.contact-item i:first-child {
    font-size: 24px;
    color: var(--accent);
    flex-shrink: 0;
    width: 32px;
}

.contact-item .arrow-icon {
    margin-left: auto;
    font-size: 18px;
    opacity: 0;
    transform: translateX(-10px);
    transition: all 0.3s ease;
    color: var(--accent);
}

.contact-item:hover {
    background: rgba(167, 139, 250, 0.08);
    border-color: rgba(167, 139, 250, 0.2);
    transform: translateX(6px);
}

.contact-item:hover .arrow-icon {
    opacity: 1;
    transform: translateX(0);
}

.contact-item a {
    color: inherit;
    text-decoration: none;
    display: contents;
}

/* Responsive */
@media (max-width: 600px) {
    .contact-container h1 {
        font-size: 30px;
    }
    .contact-item {
        font-size: 15px;
        padding: 14px 18px;
    }
}
    </style>
</head>
<body>

    <!-- ===== GLOW ORB ===== -->
    <div class="orb" id="orb"></div>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">
            <i class="fas fa-bolt"></i>
            <span>Josh's Labs</span>
        </div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../Josh Sooknanan Resume.pdf" target="_blank">Resume</a>
            <a href="My Assignments.html">Certifications</a>
            <a href="More About the Creator.html">About</a>
            <a href="Contact.html" class="active">Contact</a>
        </nav>
        <div class="header-actions">
            <a href="../index.html" class="btn-outline">
                <i class="fas fa-arrow-left"></i> Return
            </a>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>
        <div class="container contact-container">
            <span class="badge"><i class="fas fa-envelope"></i> Let's Connect</span>
            <h1>Get in <span>Touch</span></h1>
            <p class="sub-text">Feel free to reach out – I'm always open to new opportunities and collaborations.</p>

            <div class="contact-items">
                <!-- Email -->
                <a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=Joshcory05@gmail.com" target="_blank" class="contact-item">
                    <i class="fas fa-envelope"></i>
                    <span>Send me an Email for a quote</span>
                    <i class="fas fa-arrow-right arrow-icon"></i>
                </a>
                <!-- Phone -->
                <div class="contact-item">
                    <a href="https://api.whatsapp.com/send?phone=5927481398" target="_blank" class="contact-item">
                        <i class="fas fa-phone-alt"></i>
                        <span>Let's Chat on WhatsApp</span>
                        <i class="fas fa-phone-volume arrow-icon"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>Made from scratch by <span>Josh's Labs</span></p>
        <div class="social-links">
            <a href="https://github.com/JoshsLabsInc" aria-label="GitHub" target="_blank"><i class="fab fa-github"></i></a>
        </div>
    </footer>

    <!-- ===== JAVASCRIPT for glow orb ===== -->
    <script>
        const orb = document.getElementById('orb');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            orb.style.left = x + 'px';
            orb.style.top = y + 'px';
        });
    </script>
</body>
</html>
